<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harikrishnan ❤️ Gayathri</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
overflow-x:hidden;
background:#000;
}

/* Fixed Background Photo */

.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url('photos.jpg') center center/cover no-repeat;
z-index:-2;
}

.background::after{
content:'';
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
}

/* Floating Content */

.container{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:900px;
padding:40px;
text-align:center;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.2);
border-radius:30px;

box-shadow:0 8px 40px rgba(0,0,0,0.3);
}

.ring{
font-size:55px;
margin-bottom:15px;
animation:float 3s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

.small-title{
letter-spacing:4px;
font-size:13px;
text-transform:uppercase;
color:#f5d48b;
}

.names{
font-family:'Cormorant Garamond',serif;
font-size:4rem;
margin-top:10px;
margin-bottom:10px;
color:white;
}

.names span{
color:#f5d48b;
}

.subtitle{
font-size:18px;
color:#f5f5f5;
margin-bottom:30px;
}

.info{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:40px;
}

.info-box{
padding:15px 25px;
border-radius:15px;
background:rgba(255,255,255,0.08);
}

.info-title{
font-size:12px;
letter-spacing:2px;
color:#f5d48b;
}

.info-value{
margin-top:8px;
color:white;
}

.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.time{
padding:25px 10px;
background:rgba(255,255,255,0.08);
border-radius:20px;
}

.time h2{
font-size:48px;
color:#f5d48b;
}

.time p{
font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
color:white;
}

.footer{
margin-top:40px;
color:white;
}

.footer strong{
color:#f5d48b;
}

@media(max-width:768px){

.names{
font-size:2.8rem;
}

.countdown{
grid-template-columns:repeat(2,1fr);
}

.time h2{
font-size:35px;
}

.card{
padding:25px;
}

}

</style>
</head>

<body>

<div class="background"></div>

<div class="container">

<div class="card">

<div class="ring">💍</div>

<div class="small-title">
Ring Engagement Countdown
</div>

<h1 class="names">
Harikrishnan <span>&</span> Gayathri
</h1>

<p class="subtitle">
Together Forever Begins Here
</p>

<div class="info">

<div class="info-box">
<div class="info-title">DATE</div>
<div class="info-value">26 November 2026</div>
</div>

<div class="info-box">
<div class="info-title">LOCATION</div>
<div class="info-value">Meenachil Creets, Kummanam</div>
</div>

</div>

<div class="countdown">

<div class="time">
<h2 id="days">00</h2>
<p>Days</p>
</div>

<div class="time">
<h2 id="hours">00</h2>
<p>Hours</p>
</div>

<div class="time">
<h2 id="minutes">00</h2>
<p>Minutes</p>
</div>

<div class="time">
<h2 id="seconds">00</h2>
<p>Seconds</p>
</div>

</div>

<div class="footer">
<p>✨ Stay Connected For Our Special Day ✨</p>
<br>
<strong>Harikrishnan ❤️ Gayathri</strong>
</div>

</div>

</div>

<script>

const eventDate = new Date("November 26, 2026 09:00:00").getTime();

setInterval(() => {

const now = new Date().getTime();
const distance = eventDate - now;

document.getElementById("days").innerHTML =
Math.floor(distance/(1000*60*60*24));

document.getElementById("hours").innerHTML =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutes").innerHTML =
Math.floor((distance%(1000*60*60))/(1000*60));

document.getElementById("seconds").innerHTML =
Math.floor((distance%(1000*60))/1000);

},1000);

</script>

</body>
</html>
